services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    env_file:
      - .env
    environment:
      PORT: "3001"
    ports:
      - "3001:3001"
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    depends_on:
      - server
    environment:
      VITE_API_PROXY_TARGET: http://server:3001
    ports:
      - "5173:5173"
    restart: unless-stopped
